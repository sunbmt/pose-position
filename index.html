<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Teachable Machine Pose Detector</title>

    <!-- Font đẹp -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 420px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            background: linear-gradient(135deg, #ffb75e, #ed8f03);
            color: #fff;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        #canvas {
            width: 100%;
            border-radius: 16px;
            margin-top: 20px;
            background: white;
        }

        #label-container div {
            background: rgba(255, 255, 255, 0.2);
            margin-top: 8px;
            padding: 8px;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pose Detection</h1>

    <button class="btn" onclick="init()">📷 Bật Camera</button>
    <button class="btn" onclick="switchCamera()">🔄 Chuyển Camera</button>
    <button class="btn" onclick="document.getElementById('imageInput').click()">🖼️ Tải Ảnh</button>

    <input type="file" id="imageInput" accept="image/*" style="display:none"
           onchange="predictImage(event)">

    <canvas id="canvas"></canvas>
    <div id="label-container"></div>
</div>

<!-- TensorFlow & Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>

<script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/fuyn1NA_G/";

    let model, webcam, ctx, labelContainer, maxPredictions;
    let currentFacing = "environment"; // camera sau mặc định

    // Load model
    async function loadModel() {
        if (!model) {
            model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";

            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }
    }

    // Bật camera
    async function init() {
        await loadModel();

        const flip = true;
        webcam = new tmPose.Webcam(300, 300, flip);

        await webcam.setup({
            video: { facingMode: { exact: currentFacing } }
        });

        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = 300;
        canvas.height = 300;
        ctx = canvas.getContext("2d");
    }

    // Chuyển camera trước / sau
    async function switchCamera() {
        if (webcam && webcam.webcam && webcam.webcam.stop) {
            webcam.webcam.stop();
        }

        currentFacing = currentFacing === "environment" ? "user" : "environment";
        await init();
    }

    // Camera loop
    async function loop() {
        webcam.update();
        await predictWebcam();
        window.requestAnimationFrame(loop);
    }

    // Dự đoán bằng camera
    async function predictWebcam() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.childNodes[i].innerHTML =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        }

        drawPose(pose, webcam.canvas);
    }

    // Dự đoán ảnh upload
    async function predictImage(event) {
        await loadModel();

        const file = event.target.files[0];
        if (!file) return;

        const img = new Image();
        img.onload = async () => {

            const canvas = document.getElementById("canvas");
            canvas.width = img.width;
            canvas.height = img.height;

            ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            const { pose, posenetOutput } = await model.estimatePose(img);
            const prediction = await model.predict(posenetOutput);

            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.childNodes[i].innerHTML =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            }

            drawPose(pose, img);
        };

        img.src = window.URL.createObjectURL(file);
    }

    // Vẽ skeleton
    function drawPose(pose, source) {
        ctx.drawImage(source, 0, 0, ctx.canvas.width, ctx.canvas.height);
        if (pose) {
            const minPartConfidence = 0.5;
            tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
            tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
        }
    }
</script>

</body>
</html>
