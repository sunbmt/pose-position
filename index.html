<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pose Detection</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: linear-gradient(135deg, #74ABE2, #5563DE);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }
    .container {
        width: 400px;
        background: rgba(255,255,255,0.15);
        padding: 25px;
        border-radius: 16px;
        text-align: center;
        backdrop-filter: blur(6px);
    }
    button {
        margin-top: 10px;
        padding: 12px;
        width: 100%;
        font-size: 16px;
        border-radius: 12px;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }
    canvas {
        margin-top: 15px;
        width: 100%;
        border-radius: 12px;
        background: white;
    }
    #label-container div {
        padding: 5px;
        font-weight: bold;
    }
</style>
</head>

<body>
<div class="container">
    <h2>Pose Detection</h2>

    <button onclick="startCamera()">📷 Bật Camera Sau</button>
    <button onclick="document.getElementById('imgInput').click()">🖼 Upload Ảnh</button>
    <input id="imgInput" type="file" accept="image/*" style="display:none" onchange="predictImage(event)">

    <canvas id="canvas"></canvas>
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>

<script>
const MODEL = "https://teachablemachine.withgoogle.com/models/fuyn1NA_G/";
let model, webcam, ctx, maxPredictions, stream;
let cameraInterval = null; // interval 2s

// Load model
async function loadModel() {
    if (!model) {
        model = await tmPose.load(MODEL + "model.json", MODEL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        const l = document.getElementById("label-container");
        l.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++)
            l.appendChild(document.createElement("div"));
    }
}

// Start camera (back camera)
async function startCamera() {
    await loadModel();

    // Stop previous stream & interval
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    if (cameraInterval) {
        clearInterval(cameraInterval);
        cameraInterval = null;
    }

    // Start new stream
    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
    });

    const video = document.createElement("video");
    video.setAttribute("playsinline", "true");
    video.autoplay = true;
    video.srcObject = stream;

    webcam = new tmPose.Webcam(300, 300, true);
    webcam.webcam = video;

    await webcam.play();

    const canvas = document.getElementById("canvas");
    canvas.width = 300;
    canvas.height = 300;
    ctx = canvas.getContext("2d");

    // VẼ video liên tục
    requestAnimationFrame(drawCameraLoop);

    // CHẠY predict mỗi 2s
    cameraInterval = setInterval(async () => {
        await predictWebcam();
    }, 2000);
}

// Vẽ video liên tục
function drawCameraLoop() {
    if (webcam && webcam.webcam.readyState === 4) {
        ctx.drawImage(webcam.webcam, 0, 0, ctx.canvas.width, ctx.canvas.height);
    }
    requestAnimationFrame(drawCameraLoop);
}

async function predictWebcam() {
    if (!webcam) return;

    const { pose, posenetOutput } = await model.estimatePose(webcam.webcam);
    const prediction = await model.predict(posenetOutput);

    updateLabels(prediction);
    drawPose(pose, webcam.webcam);
}

function updateLabels(pred) {
    const l = document.getElementById("label-container");
    for (let i = 0; i < pred.length; i++) {
        l.childNodes[i].innerHTML =
            pred[i].className + ": " + Math.round(pred[i].probability * 100) + "%";
    }
}

// Upload image
async function predictImage(e) {
    await loadModel();

    // Stop camera interval
    if (cameraInterval) {
        clearInterval(cameraInterval);
        cameraInterval = null;
    }
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }

    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = async () => {
        const canvas = document.getElementById("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);

        const { pose, posenetOutput } = await model.estimatePose(img);
        const prediction = await model.predict(posenetOutput);

        updateLabels(prediction);
        drawPose(pose, img);
    };

    img.src = URL.createObjectURL(file);
}

function drawPose(pose, source) {
    ctx.drawImage(source, 0, 0, ctx.canvas.width, ctx.canvas.height);
    if (!pose) return;
    tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
    tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
}
</script>
</body>
</html>
