<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pose Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
    }

    .container {
        width: 380px;
        background: rgba(255,255,255,0.15);
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        text-align: center;
    }

    h2 {
        font-weight: 600;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    canvas {
        width: 100%;
        height: auto;
        border-radius: 15px;
        background: #fff;
        margin-top: 15px;
    }

    .btn {
        margin-top: 15px;
        padding: 12px 18px;
        border: none;
        border-radius: 30px;
        background: #ffffff33;
        backdrop-filter: blur(5px);
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
        width: 100%;
    }

    .btn:hover {
        background: #ffffff55;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.3.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

</head>
<body>

<div class="container">
    <h2>Pose Detector</h2>

    <button id="switchBtn" class="btn">Chuyển Camera</button>

    <canvas id="canvas"></canvas>
</div>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL/";
let model, webcam, ctx, flip = true;
let currentFacing = "user";  // user = camera trước

async function initCamera() {
    if (webcam) await webcam.stop(); // tắt camera cũ

    webcam = new tmPose.Webcam(300, 300, flip);

    await webcam.setup({
        video: { facingMode: currentFacing }
    });

    await webcam.play();
}

async function init() {
    model = await tmPose.load(URL + "model.json", URL + "metadata.json");

    await initCamera();

    const canvas = document.getElementById("canvas");
    canvas.width = 300;
    canvas.height = 300;
    ctx = canvas.getContext("2d");

    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    drawCamera();
    window.requestAnimationFrame(loop);
}

function drawCamera() {
    ctx.drawImage(webcam.canvas, 0, 0);
}

// NÚT CHUYỂN CAMERA
document.getElementById("switchBtn").addEventListener("click", async () => {
    currentFacing = currentFacing === "user" ? "environment" : "user";
    await initCamera();
});

// START APP
init();
</script>

</body>
</html>
