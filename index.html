<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/fuyn1NA_G/";

let model, webcam, ctx, labelContainer, maxPredictions;
let currentFacing = "environment"; // camera sau mặc định
let stream = null;

// ----------------------------
// LOAD MODEL
// ----------------------------
async function loadModel() {
    if (!model) {
        model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }
    }
}

// ----------------------------
// START CAMERA (STREAM REAL)
// ----------------------------
async function init() {
    await loadModel();

    // Ngắt stream cũ (nếu có)
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
    }

    // Lấy camera trước hoặc sau
    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing },
        audio: false
    });

    const flip = true;
    webcam = new tmPose.Webcam(300, 300, flip);
    await webcam.setup();
    webcam.webcam.srcObject = stream;

    await webcam.play();
    window.requestAnimationFrame(loop);

    const canvas = document.getElementById("canvas");
    canvas.width = 300;
    canvas.height = 300;
    ctx = canvas.getContext("2d");
}

// ----------------------------
// SWITCH CAMERA
// ----------------------------
async function switchCamera() {
    currentFacing = currentFacing === "environment" ? "user" : "environment";
    await init();
}

// ----------------------------
async function loop() {
    webcam.update();
    await predictWebcam();
    window.requestAnimationFrame(loop);
}

async function predictWebcam() {
    const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
    const prediction = await model.predict(posenetOutput);

    for (let i = 0; i < maxPredictions; i++) {
        labelContainer.childNodes[i].innerHTML =
            prediction[i].className + ": " + prediction[i].probability.toFixed(2);
    }

    drawPose(pose, webcam.canvas);
}

// ----------------------------
// PREDICT IMAGE
// ----------------------------
async function predictImage(event) {
    await loadModel();

    const file = event.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = async () => {
        const canvas = document.getElementById("canvas");
        canvas.width = img.width;
        canvas.height = img.height;

        ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);

        const { pose, posenetOutput } = await model.estimatePose(img);
        const prediction = await model.predict(posenetOutput);

        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.childNodes[i].innerHTML =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        }

        drawPose(pose, img);
    };

    img.src = window.URL.createObjectURL(file);
}

// ----------------------------
function drawPose(pose, source) {
    ctx.drawImage(source, 0, 0, ctx.canvas.width, ctx.canvas.height);
    if (pose) {
        const minPartConfidence = 0.5;
        tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
        tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
    }
}
</script>
