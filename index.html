<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teachable Machine Pose Model</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #74ABE2, #5563DE);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .container {
        background: rgba(255, 255, 255, 0.12);
        padding: 25px 35px;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        backdrop-filter: blur(8px);
        text-align: center;
        width: 420px;
    }

    h1 {
        margin-top: 0;
        font-size: 24px;
        letter-spacing: 1px;
    }

    button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-top: 10px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        background: #fff;
        color: #333;
        font-weight: bold;
    }

    canvas {
        margin-top: 20px;
        border-radius: 14px;
        width: 100%;
        background: white;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Pose Detection</h1>

    <button onclick="startCamera()">📷 Bật Camera Sau</button>

    <button onclick="document.getElementById('imageInput').click()">🖼 Upload Ảnh</button>
    <input type="file" id="imageInput" accept="image/*" onchange="predictImage(event)" style="display:none">

    <canvas id="canvas"></canvas>
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>

<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/fuyn1NA_G/";
let model, webcam, ctx, maxPredictions;
let stream = null;

// Load model
async function loadModel() {
    if (!model) {
        model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        const l = document.getElementById("label-container");
        l.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            l.appendChild(document.createElement("div"));
        }
    }
}

// START CAMERA (REAL back camera)
async function startCamera() {
    await loadModel();

    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
    });

    webcam = new tmPose.Webcam(300, 300, true);
    await webcam.setup();
    webcam.webcam.srcObject = stream;

    await webcam.play();

    const canvas = document.getElementById("canvas");
    canvas.width = 300;
    canvas.height = 300;
    ctx = canvas.getContext("2d");

    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    await predictWebcam();
    window.requestAnimationFrame(loop);
}

async function predictWebcam() {
    const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
    const prediction = await model.predict(posenetOutput);

    const l = document.getElementById("label-container");
    for (let i = 0; i < maxPredictions; i++) {
        l.childNodes[i].innerHTML = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
    }

    drawPose(pose, webcam.canvas);
}

// UPLOAD IMAGE
async function predictImage(event) {
    await loadModel();

    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }

    const file = event.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = async () => {
        const canvas = document.getElementById("canvas");
        canvas.width = img.width;
        canvas.height = img.height;

        ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);

        const { pose, posenetOutput } = await model.estimatePose(img);
        const prediction = await model.predict(posenetOutput);

        const l = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
            l.childNodes[i].innerHTML = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        }

        drawPose(pose, img);
    };

    img.src = URL.createObjectURL(file);
}

function drawPose(pose, source) {
    ctx.drawImage(source, 0, 0, ctx.canvas.width, ctx.canvas.height);

    if (pose) {
        tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
        tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
    }
}
</script>

</body>
</html>
